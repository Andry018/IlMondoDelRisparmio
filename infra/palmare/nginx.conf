server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location ~* \.(js|mjs)$ { types { } default_type text/javascript; add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest { default_type application/manifest+json; }

    # Sempre la versione più recente dopo un aggiornamento (i file sono piccoli)
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
