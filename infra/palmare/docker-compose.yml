# Palmare, versione web: serve i file dell'app (palmare/www del progetto) sulla porta 8080.
# Sui palmari si installa l'APK (palmare/README.md); questa versione serve da PC e per le prove.
# L'app parla con Supabase (Kong) sulla porta 8000: indirizzo e chiave pubblica in config.json.
#   cd infra/palmare && docker compose up -d
services:
  palmare:
    image: nginx:1.27-alpine
    container_name: mdr-palmare
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ../../palmare/www:/usr/share/nginx/html:ro
      - ./config.json:/usr/share/nginx/html/config.json:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
